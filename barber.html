<script>
(function () {
  // Year
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Wire up CTAs
  document.getElementById('cta-btn').href = WAITAROUND_CLIENTS_APP_STORE_URL;
  document.getElementById('gplay-btn').href = WAITAROUND_CLIENTS_GOOGLE_PLAY_URL;

  // Spanish toggle — preserve ?p= slug so the barber-es page works the same way
  var esBtn = document.getElementById('lang-es-btn');
  var esBase = '/barber-es';
  var pParam = new URLSearchParams(window.location.search).get('p');
  esBtn.href = pParam ? esBase + '?p=' + encodeURIComponent(pParam) : esBase;

  // The valid state is the DEFAULT — HTML already shows correct copy.
  // Only override to the invalid state when ?p= is explicitly present
  // AND contains a value that is clearly not a valid barber slug.
  // This way the page shows correctly whether opened:
  //   - via 404 router (?p=/barber/dejesusbarber)  → valid
  //   - directly in browser (/barber/dejesusbarber) → valid
  //   - as a file:// preview                        → valid (no ?p= param)
  //   - with a broken link (?p=/barber/)            → invalid

  if (pParam !== null && !/^\/barber\/[a-zA-Z0-9_-]+\/?$/.test(pParam)) {
    // ?p= was provided but is not a valid /barber/<slug> — genuinely broken link
    var card = document.getElementById('card');
    card.classList.add('card--invalid');
    card.querySelector('.headline').textContent  = 'Waiting Room link unavailable.';
    card.querySelector('.body-copy').textContent =
      'This link may be invalid or expired.';
  }
})();
</script>
